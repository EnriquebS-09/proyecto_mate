<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <style>
    .video-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    video {
      width: 100%;
      height: auto;
    }
    .error-msg {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="video-container">
      <video id="video" controls autoplay="false"></video>
      <div id="error-msg" class="error-msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    var video = document.getElementById('video');
    var videoUrl = 'http://live.redtraffic.xyz/livecams.m3u8';
    
    if (Hls.isSupported()) {
      var hls = new Hls();
      hls.loadSource(videoUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
      hls.on(Hls.Events.ERROR, function(event, data) {
        document.getElementById('error-msg').innerHTML = 'Error: No se pudo cargar el stream. Verifica que la URL sea correcta y accesible.';
        console.error('HLS Error:', data);
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoUrl;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    } else {
      document.getElementById('error-msg').innerHTML = 'Tu navegador no soporta HLS.';
    }
  </script>
